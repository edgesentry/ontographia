name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: bash scripts/cli_smoke_test.sh

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        run: uv sync --group dev
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: smoke test
        run: uv run --python "$(command -v python3)" python scripts/python_smoke_test.py
      - name: Intent layer unit tests (ontographia[llm])
        run: uv run --python "$(command -v python3)" pytest tests/python/llm -q
      - name: MCP server unit tests (ontographia[mcp])
        run: uv run --python "$(command -v python3)" pytest tests/python/mcp -q

  neo4j-integration:
    name: neo4j-integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      neo4j:
        image: neo4j:2025.06
        env:
          NEO4J_AUTH: neo4j/ontographia
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        # Include ontographia[mcp] so MCP execute can talk to the service Neo4j.
        run: uv sync --group dev --extra mcp
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: neo4j integration test
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          NEO4J_LOAD_SEED: "1"
        run: uv run --python "$(command -v python3)" python scripts/neo4j_integration_test.py
      - name: MCP execute integration tests (live Neo4j)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          # Seed already loaded by the previous step; avoid re-seeding.
          NEO4J_LOAD_SEED: "0"
        run: >-
          uv run --python "$(command -v python3)"
          pytest tests/python/mcp/test_execute_neo4j_integration.py -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.22"
      - name: build FFI library
        run: cargo build --release -p ontographia-ffi
      - name: go test
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go test -v ./...
