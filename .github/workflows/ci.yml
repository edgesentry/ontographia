name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: bash scripts/cli_smoke_test.sh

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        run: uv sync --group dev
      - name: Resolve litellm dependency group (dry-run, no install)
        # Catch --group name drift vs pyproject [dependency-groups] without pulling LLM APIs.
        run: uv sync --group litellm --frozen --dry-run
      - name: Verify uv --group refs in scripts/docs
        run: uv run --python "$(command -v python3)" pytest tests/python/test_uv_dependency_groups.py -q
      - name: LiteLLM dotenvx env guard unit tests
        run: uv run --python "$(command -v python3)" pytest tests/python/test_litellm_dotenvx_guard.py -q
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: smoke test
        run: uv run --python "$(command -v python3)" python scripts/python_smoke_test.py
      - name: Intent layer unit tests (ontographia[llm])
        run: uv run --python "$(command -v python3)" pytest tests/python/llm -q
      - name: MCP server unit tests (ontographia[mcp])
        run: uv run --python "$(command -v python3)" pytest tests/python/mcp -q

  # Guard + optional decrypt for scripts/litellm/.env.encrypted (issue #105).
  # Does not add repository secrets; skips decrypt when DOTENV_PRIVATE_KEY is unset.
  litellm-dotenvx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Reject plaintext in tracked LiteLLM env files
        run: bash scripts/litellm/check_encrypted_env.sh
      - name: Install dotenvx
        run: |
          curl -sfS https://dotenvx.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Optional decrypt smoke (requires DOTENV_PRIVATE_KEY secret)
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DOTENV_PRIVATE_KEY:-}" ]]; then
            echo "DOTENV_PRIVATE_KEY secret not set; skipping decrypt smoke"
            exit 0
          fi
          if [[ ! -f scripts/litellm/.env.encrypted ]]; then
            echo "scripts/litellm/.env.encrypted not present; skipping decrypt smoke"
            exit 0
          fi
          dotenvx get -f scripts/litellm/.env.encrypted --format json >/dev/null
          echo "ok: decrypted scripts/litellm/.env.encrypted with DOTENV_PRIVATE_KEY"

  neo4j-integration:
    name: neo4j-integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      neo4j:
        image: neo4j:2025.06
        env:
          NEO4J_AUTH: neo4j/ontographia
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-neo4j-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-neo4j-${{ matrix.python-version }}-
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        # Include ontographia[mcp] so MCP execute can talk to the service Neo4j.
        run: uv sync --group dev --extra mcp
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: neo4j integration test
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          NEO4J_LOAD_SEED: "1"
        run: uv run --python "$(command -v python3)" python scripts/neo4j_integration_test.py
      - name: MCP execute integration tests (live Neo4j)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          # Seed already loaded by the previous step; avoid re-seeding.
          NEO4J_LOAD_SEED: "0"
        run: >-
          uv run --python "$(command -v python3)"
          pytest tests/python/mcp/test_execute_neo4j_integration.py -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-go-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-go-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.22"
      - name: build FFI library
        run: cargo build --release -p ontographia-ffi
      - name: go test
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go test -v ./...
