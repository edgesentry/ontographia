name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: install python dependencies
        run: uv sync --group dev
      - name: build and install bindings
        run: uv run maturin develop --release
      - name: smoke test
        run: uv run python scripts/python_smoke_test.py

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2025.06
        env:
          NEO4J_AUTH: neo4j/ontographia
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: install python dependencies
        run: uv sync --group dev
      - name: build and install bindings
        run: uv run maturin develop --release
      - name: neo4j integration test
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          NEO4J_LOAD_SEED: "1"
        run: uv run python scripts/neo4j_integration_test.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build FFI library
        run: cargo build --release -p ontographia-ffi
      - name: go test
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -v ./...
