name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: CLI smoke test
        run: bash scripts/cli_smoke_test.sh

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        run: uv sync --group dev
      - name: Resolve litellm dependency group (dry-run, no install)
        # Catch --group name drift vs pyproject [dependency-groups] without pulling LLM APIs.
        run: uv sync --group litellm --frozen --dry-run
      - name: Verify uv --group refs in scripts/docs
        run: uv run --python "$(command -v python3)" pytest tests/python/test_uv_dependency_groups.py -q
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: smoke test
        run: uv run --python "$(command -v python3)" python scripts/python_smoke_test.py
      - name: Intent layer unit tests (ontographia[llm])
        run: uv run --python "$(command -v python3)" pytest tests/python/llm -q
      - name: MCP server unit tests (ontographia[mcp])
        run: uv run --python "$(command -v python3)" pytest tests/python/mcp -q
      - name: otg CLI unit tests
        run: uv run --python "$(command -v python3)" pytest tests/python/cli -q

  neo4j-integration:
    name: neo4j-integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      neo4j:
        image: neo4j:2025.06
        env:
          NEO4J_AUTH: neo4j/ontographia
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-neo4j-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-neo4j-${{ matrix.python-version }}-
      - name: Pin Python for uv
        run: uv python pin ${{ matrix.python-version }}
      - name: install python dependencies
        # Include ontographia[mcp] so MCP execute can talk to the service Neo4j.
        run: uv sync --group dev --extra mcp
      - name: build and install bindings
        run: uv run --python "$(command -v python3)" maturin develop --release
      - name: neo4j integration test
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          NEO4J_LOAD_SEED: "1"
        run: uv run --python "$(command -v python3)" python scripts/neo4j_integration_test.py
      - name: MCP execute integration tests (live Neo4j)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ontographia
          # Seed already loaded by the previous step; avoid re-seeding.
          NEO4J_LOAD_SEED: "0"
        run: >-
          uv run --python "$(command -v python3)"
          pytest tests/python/mcp/test_execute_neo4j_integration.py -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-go-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-go-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.22"
      - name: build FFI library
        run: cargo build --release -p ontographia-ffi
      - name: go test (checkout link tag)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -tags ontographia_checkout -count=1 -v ./...
      - name: go module-consumer smoke
        run: bash bindings/go/scripts/smoke-module-consumer.sh

  # TypeScript binding smoke. 26 is the current LTS; 22 stays supported through 2027-04.
  node:
    name: node (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-node-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - name: build FFI library
        run: cargo build --release -p ontographia-ffi
      - name: npm test
        working-directory: bindings/typescript
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          npm ci
          npm test
      - name: demo
        working-directory: bindings/typescript
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: npm run demo
      - name: Pack npm tarball for this platform
        if: matrix.node-version == '22'
        run: node scripts/package-npm.mjs --local --skip-build --out "${{ runner.temp }}/ontographia-npm"

  # Browser WASM npm package: build with the pinned toolchain, pack, install the
  # tarball in a clean directory, and compile the fixed PLM Intents.
  wasm-npm:
    name: wasm npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < bindings/wasm/rust-toolchain.version)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Rust ABI tests
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < bindings/wasm/rust-toolchain.version)"
          cargo "+$TOOLCHAIN" test -p ontographia-wasm
      - name: Build, pack, install, smoke
        run: node bindings/wasm/scripts/smoke-packed.mjs
