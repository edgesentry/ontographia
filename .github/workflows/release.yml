# One-shot release: preflight (release check) → tag + GitHub Release → build & upload.
# See docs/release.md
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match Cargo.toml on main), e.g. 0.1.1"
        required: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  preflight:
    name: Pre-release validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run preflight (version, tag availability, release check)
        run: bash scripts/preflight-release.sh "${{ inputs.version }}"

  create-release:
    name: Create tag and GitHub Release
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh release create "${{ env.RELEASE_TAG }}" \
            --target "$SHA" \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes

  verify:
    name: Claim version and verify tag
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Refuse re-release of immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-not-processed.sh "${{ env.RELEASE_TAG }}"

      - name: Claim release version
        run: bash scripts/claim-release-processed.sh "${{ env.RELEASE_TAG }}"

      - name: Verify tag matches workspace version
        run: bash scripts/verify-release-version.sh "${{ env.RELEASE_TAG }}"

  build-cli:
    name: CLI (${{ matrix.artifact }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p ontographia-cli --target ${{ matrix.target }}
      - name: Package CLI
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="ontographia-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/${NAME}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/ontographia.exe" "dist/${NAME}/"
          else
            cp "target/${{ matrix.target }}/release/ontographia" "dist/${NAME}/"
          fi
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: dist/*.tar.gz

  build-ffi:
    name: FFI (${{ matrix.artifact }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            lib: libontographia_ffi.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            lib: libontographia_ffi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            lib: ontographia_ffi.dll
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build FFI
        run: cargo build --release -p ontographia-ffi --target ${{ matrix.target }}
      - name: Package FFI
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="libontographia_ffi-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "dist/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.artifact }}
          path: dist/*.tar.gz

  build-wheels:
    name: Python wheels (${{ matrix.python-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build wheels
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group dev
          uv run --python "$(command -v python3)" maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.python-version }}
          path: dist/*.whl

  upload-assets:
    name: Upload GitHub Release assets
    needs: [build-cli, build-ffi, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.tar.gz' -o -name '*.whl' \) -exec cp {} release-files/ \;
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-files/*
          overwrite_files: true

  tag-go-module:
    name: Tag Go module
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Push bindings/go tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          GO_TAG="bindings/go/${RELEASE_TAG}"
          if git ls-remote --tags origin "refs/tags/${GO_TAG}" | grep -q .; then
            echo "error: ${GO_TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GO_TAG" "${GITHUB_SHA}"
          git push origin "$GO_TAG"

  publish-crates:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish ontographia-core
        run: cargo publish -p ontographia-core --allow-dirty
      - name: Wait for crates.io index
        run: sleep 45
      - name: Publish ontographia-adapters
        run: cargo publish -p ontographia-adapters --allow-dirty
      - name: Publish ontographia-schema
        run: cargo publish -p ontographia-schema --allow-dirty
      - name: Wait for crates.io index
        run: sleep 45
      - name: Publish ontographia-cli
        run: cargo publish -p ontographia-cli --allow-dirty

  publish-pypi:
    name: Publish PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
