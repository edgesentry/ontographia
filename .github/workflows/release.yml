# Manual release only (workflow_dispatch). Never runs on push to main or release events.
# Preflight → tag + GitHub Release → build & upload. Version from Cargo.toml.
# npm tarballs are always attached. npm publish runs only when PUBLISH_TO_REGISTRIES is true.
# See docs/release.md
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve version from Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Read workspace version
        id: version
        run: |
          VERSION="$(bash scripts/workspace-version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION} from Cargo.toml"

  preflight:
    needs: resolve-version
    uses: ./.github/workflows/preflight-release.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  create-release:
    name: Create tag and GitHub Release
    needs: [resolve-version, preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse HEAD)"
          gh release create "${{ env.RELEASE_TAG }}" \
            --target "$SHA" \
            --title "${{ env.RELEASE_TAG }}" \
            --generate-notes

  verify:
    name: Claim version and verify tag
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Refuse re-release of immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-not-processed.sh "${{ env.RELEASE_TAG }}"

      - name: Claim release version
        run: bash scripts/claim-release-processed.sh "${{ env.RELEASE_TAG }}"

      - name: Verify tag matches workspace version
        run: bash scripts/verify-release-version.sh "${{ env.RELEASE_TAG }}"

  build-cli:
    name: CLI (${{ matrix.artifact }})
    needs: [resolve-version, verify]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cli-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      - name: Build CLI
        run: cargo build --release -p ontographia-cli --target ${{ matrix.target }}
      - name: Package CLI
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="ontographia-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/${NAME}"
          # `otg` is the binary Cargo builds and the Homebrew command name.
          # `ontographia` is a copy of that file so the current tap formula,
          # which looks up that filename, keeps installing. Drop the copy
          # after the tap installs `otg` (issue #121). `--version` prints `otg`.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/otg.exe" "dist/${NAME}/otg.exe"
            cp "target/${{ matrix.target }}/release/otg.exe" "dist/${NAME}/ontographia.exe"
          else
            cp "target/${{ matrix.target }}/release/otg" "dist/${NAME}/otg"
            cp "target/${{ matrix.target }}/release/otg" "dist/${NAME}/ontographia"
          fi
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cli-${{ matrix.artifact }}
          path: dist/*.tar.gz

  build-ffi:
    name: FFI (${{ matrix.artifact }})
    needs: [resolve-version, verify]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            lib: libontographia_ffi.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            lib: libontographia_ffi.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
            lib: libontographia_ffi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            lib: ontographia_ffi.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-ffi-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ffi-${{ matrix.target }}-
            ${{ runner.os }}-cargo-
      - name: Build FFI
        run: cargo build --release -p ontographia-ffi --target ${{ matrix.target }}
      - name: Package FFI
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NAME="libontographia_ffi-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "dist/${NAME}/"
          # MSVC import library. MinGW cgo links ontographia_ffi.dll by name;
          # link.exe needs this file. npm packaging still picks the DLL only.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/ontographia_ffi.dll.lib" "dist/${NAME}/"
          fi
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ffi-${{ matrix.artifact }}
          path: dist/*.tar.gz

  build-wheels:
    name: Python wheels (${{ matrix.platform }}, py${{ matrix.python-version }})
    needs: [resolve-version, verify]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            python-version: "3.11"
          - os: ubuntu-latest
            platform: linux-x86_64
            python-version: "3.12"
          - os: ubuntu-latest
            platform: linux-x86_64
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: "3.11"
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: "3.12"
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: "3.13"
          - os: macos-latest
            platform: macos-arm64
            python-version: "3.11"
          - os: macos-latest
            platform: macos-arm64
            python-version: "3.12"
          - os: macos-latest
            platform: macos-arm64
            python-version: "3.13"
          - os: windows-latest
            platform: windows-x86_64
            python-version: "3.11"
          - os: windows-latest
            platform: windows-x86_64
            python-version: "3.12"
          - os: windows-latest
            platform: windows-x86_64
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wheels-${{ matrix.platform }}-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wheels-${{ matrix.platform }}-${{ matrix.python-version }}-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned action verifies the uv 0.13.6 release checksum before wheels are published.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-wheels-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-wheels-${{ matrix.python-version }}-
      - name: Build wheels
        shell: bash
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group dev
          uv run maturin build --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-wheels-${{ matrix.platform }}-${{ matrix.python-version }}
          path: dist/*.whl

  package-npm:
    name: Package npm
    needs: [resolve-version, build-ffi]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ffi-*
          path: ffi-artifacts
          merge-multiple: true
      - name: Pack npm packages
        run: node scripts/package-npm.mjs --ffi-archives ffi-artifacts --out dist/npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-tarballs
          path: dist/npm/*.tgz

  package-wasm-npm:
    name: Package WASM npm
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install pinned Rust toolchain
        run: |
          TOOLCHAIN="$(tr -d '[:space:]' < bindings/wasm/rust-toolchain.version)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update --target wasm32-unknown-unknown
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Build, pack, and smoke-test
        env:
          WASM_NPM_OUT: ${{ runner.temp }}/wasm-npm
        run: |
          bash bindings/wasm/scripts/build-package.sh --pack --out "$WASM_NPM_OUT"
          node bindings/wasm/scripts/smoke-packed.mjs \
            --tarball "${WASM_NPM_OUT}/edgesentry-ontographia-wasm-${RELEASE_TAG#v}.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wasm-npm-tarball
          path: ${{ runner.temp }}/wasm-npm/*.tgz

  upload-assets:
    name: Upload GitHub Release assets
    needs: [resolve-version, build-cli, build-ffi, build-wheels, package-npm, package-wasm-npm]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      # gh release upload resolves the repository with git. This job only
      # downloads artifacts, so without a checkout it exits
      # "fatal: not a git repository".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.tar.gz' -o -name '*.whl' -o -name '*.tgz' \) -exec cp {} release-files/ \;
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Equivalent to softprops/action-gh-release overwrite_files=true.
          # GH_REPO names the repo even if git remote detection fails.
          gh release upload "${{ env.RELEASE_TAG }}" release-files/* --clobber

  tag-go-module:
    name: Tag Go module
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Push bindings/go tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          GO_TAG="bindings/go/${RELEASE_TAG}"
          if git ls-remote --tags origin "refs/tags/${GO_TAG}" | grep -q .; then
            echo "error: ${GO_TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Same commit as vX.Y.Z. The dispatch ref can differ from the main
          # checkout that created the release tag, so do not tag that ref.
          TARGET="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$TARGET" != "$TAG_COMMIT" ]]; then
            echo "error: HEAD ${TARGET} is not ${RELEASE_TAG} (${TAG_COMMIT})" >&2
            exit 1
          fi
          git tag -a "$GO_TAG" "$TARGET" -m "Release ${RELEASE_TAG} (Go module)"
          git push origin "$GO_TAG"

  publish-crates:
    name: Publish Rust crates
    needs: [resolve-version, verify]
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Publish Rust crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_if_missing() {
            crate="$1"
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='$crate'))")"
            url="https://crates.io/api/v1/crates/${crate}/${version}"

            if curl --silent --show-error --fail "$url" >/dev/null 2>&1; then
              echo "${crate}@${version} already exists on crates.io. Skipping publish."
              return 0
            fi

            echo "Publishing ${crate}@${version} ..."
            cargo publish -p "$crate" --allow-dirty
          }

          publish_if_missing ontographia-core
          sleep 45
          publish_if_missing ontographia-adapters
          publish_if_missing ontographia-schema
          sleep 45
          publish_if_missing ontographia-cli

  publish-pypi:
    name: Publish PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  publish-npm:
    name: Publish npm
    needs: [resolve-version, package-npm]
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    # Workflow permissions include id-token: write. A job permissions block
    # replaces that inheritance, so this job sets id-token: write itself.
    # npm Trusted Publishing mints its OIDC token from that permission.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.release_tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI for Trusted Publishing
        # registry-url makes setup-node export a placeholder NODE_AUTH_TOKEN.
        # This install uses a token-free npmrc. publish-npm.sh rejects a real token.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npmrc="${RUNNER_TEMP}/npmrc-install"
          printf 'registry=https://registry.npmjs.org/\n' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm install -g npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-tarballs
          path: dist/npm
      - name: Publish to npm
        # publish-npm.sh refuses to run unless GITHUB_JOB is publish-npm
        # (this job id). Do not rename the job id without updating that guard.
        # Do not set NODE_AUTH_TOKEN or NPM_TOKEN. Provenance is automatic.
        run: bash scripts/publish-npm.sh dist/npm

  publish-wasm-npm:
    name: Publish WASM npm
    needs: [resolve-version, package-wasm-npm]
    runs-on: ubuntu-latest
    if: vars.PUBLISH_TO_REGISTRIES == 'true'
    # Matches publish-npm: a job permissions block replaces workflow
    # inheritance, so id-token: write is set here for npm Trusted Publishing.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-version.outputs.release_tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI for Trusted Publishing
        # registry-url makes setup-node export a placeholder NODE_AUTH_TOKEN.
        # This install uses a token-free npmrc. publish-wasm-npm.sh rejects a real token.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npmrc="${RUNNER_TEMP}/npmrc-install"
          printf 'registry=https://registry.npmjs.org/\n' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" npm install -g npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wasm-npm-tarball
          path: dist/wasm-npm
      - name: Publish to npm
        # publish-wasm-npm.sh refuses to run unless GITHUB_JOB is
        # publish-wasm-npm (this job id). Do not rename the job id without
        # updating that guard. Do not set NODE_AUTH_TOKEN or NPM_TOKEN.
        run: bash scripts/publish-wasm-npm.sh dist/wasm-npm
