name: Docs Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs_check.sh"
  push:
    branches-ignore:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs_check.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Lint, build, and assert docs HTML
        run: bash scripts/docs_check.sh
