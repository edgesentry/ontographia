name: Docs Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs_check.sh"
  push:
    branches-ignore:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs_check.sh"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Lint, build, and assert docs HTML
        run: bash scripts/docs_check.sh
