name: Docs Check

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      - name: Build (strict — broken links fail CI)
        run: mkdocs build --strict
