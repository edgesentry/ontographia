# Shared preflight job: version match, tag availability, release-check.sh
# Called by Release check (dry-run only) and Release (first stage).
name: Preflight release

on:
  workflow_call:
    inputs:
      version:
        description: "Version to validate (defaults to Cargo.toml workspace version when empty)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Pre-release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-preflight-
            ${{ runner.os }}-cargo-
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-preflight-${{ hashFiles('**/uv.lock', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-preflight-

      - name: Run preflight (version, tag availability, release check)
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            bash scripts/preflight-release.sh "${{ inputs.version }}"
          else
            bash scripts/preflight-release.sh
          fi
