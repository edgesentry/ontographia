# Shared preflight job: version match, tag availability, release-check.sh
# Called by Release check (dry-run only) and Release (first stage).
name: Preflight release

on:
  workflow_call:
    inputs:
      version:
        description: "Version to validate (defaults to Cargo.toml workspace version when empty)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Pre-release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Run preflight (version, tag availability, release check)
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            bash scripts/preflight-release.sh "${{ inputs.version }}"
          else
            bash scripts/preflight-release.sh
          fi
