# Repo-managed CodeQL (replaces GitHub "Default setup").
#
# REQUIRED once before this workflow can upload results:
#   Settings → Code security and analysis → Code scanning → CodeQL analysis
#   → Default setup → Disable
#
# Default setup and this workflow cannot both be active (SARIF upload conflict).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: go
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: "1.22"

      - name: Setup Rust
        if: matrix.language == 'rust' || matrix.language == 'go'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Rust uses build-mode none (rust-analyzer); cargo/rustup must be on PATH.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go (cgo)
        if: matrix.language == 'go'
        env:
          CGO_ENABLED: "1"
        run: |
          cargo build --release -p ontographia-ffi
          cd bindings/go
          go test -tags ontographia_checkout -c ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
