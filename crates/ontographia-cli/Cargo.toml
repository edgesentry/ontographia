[package]
name = "ontographia-cli"
description = "Command-line interface for Ontographia (binary name: otg)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
default-run = "otg"
keywords = ["neo4j", "cypher", "ontology", "graph", "cli"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "otg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ontographia-adapters = { workspace = true }
ontographia-core = { workspace = true }
ontographia-schema = { workspace = true }
serde_json = { workspace = true }
