[workspace]
resolver = "2"
members = [
    "crates/ontographia-core",
    "crates/ontographia-adapters",
    "crates/ontographia-ffi",
    "crates/ontographia-schema",
    "crates/ontographia-cli",
    "crates/ontographia-integration-tests",
    "bindings/python",
]
default-members = [
    "crates/ontographia-core",
    "crates/ontographia-adapters",
    "crates/ontographia-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Ontographia Contributors"]
repository = "https://github.com/edgesentry/ontographia"

[workspace.dependencies]
ontographia-core = { version = "0.1.1", path = "crates/ontographia-core" }
ontographia-adapters = { version = "0.1.1", path = "crates/ontographia-adapters" }
ontographia-schema = { version = "0.1.1", path = "crates/ontographia-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["derive"] }
