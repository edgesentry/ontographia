[workspace]
resolver = "2"
members = [
    "crates/ontographia-core",
    "crates/ontographia-adapters",
    "crates/ontographia-ffi",
    "bindings/python",
]
default-members = [
    "crates/ontographia-core",
    "crates/ontographia-adapters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ontographia Contributors"]
repository = "https://github.com/ontographia/ontographia"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["derive"] }
