[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
# `paste` 1.x is unmaintained and has no patched release. neo4rs 0.9.0-rc.11
# client-side routing (`unstable-bolt-protocol-impl-v2`, needed for neo4j://
# and neo4j+s://) depends on nav-types → nalgebra → simba, and simba 0.8 calls
# `paste`. `Graph::execute_read` stays on that driver. The maintained fork is
# `pastey`, which neo4rs itself already uses; simba does not.
reason = "Unmaintained paste via neo4rs routing (nav-types/nalgebra/simba); no fixed version. Routing and execute_read stay on neo4rs 0.9.0-rc.11."
