# Ontographia native ontology — thin PLM subset (demo-sized)
# Engineering BOM / manufacturing BOP / ECO / substances. Subset only; see README.md.

namespaces:
  plm: http://example.org/ontographia/plm#

classes:
  - name: Part
    description: Component item in a bill of materials
  - name: Assembly
    description: Item composed of parts and/or sub-assemblies
  - name: Revision
    description: Released revision of a part or assembly
  - name: ECO
    description: Engineering change order
  - name: Operation
    description: Manufacturing operation in a bill of process
  - name: WorkCenter
    description: Resource where operations are performed
  - name: Substance
    description: Chemical substance referenced by materials
  - name: Customer
    description: Customer of the product

relationships:
  - name: CONTAINS
    from_class: Assembly
    to_class: Part
    direction: out
  - name: CONTAINS
    from_class: Assembly
    to_class: Assembly
    direction: out
  - name: CONTAINS
    from_class: Part
    to_class: Part
    direction: out
  - name: CONSUMES
    from_class: Operation
    to_class: Part
    direction: out
  - name: CONSUMES
    from_class: Operation
    to_class: Substance
    direction: out
  - name: AFFECTS
    from_class: ECO
    to_class: Part
    direction: out
  - name: AFFECTS
    from_class: ECO
    to_class: Assembly
    direction: out
  - name: AFFECTS
    from_class: ECO
    to_class: Revision
    direction: out
  - name: ALTERNATE_OF
    from_class: Part
    to_class: Part
    direction: out

properties:
  - name: part_number
    owner_class: Part
    datatype: string
    required: true
    unique: true
  - name: name
    owner_class: Part
    datatype: string
  - name: part_number
    owner_class: Assembly
    datatype: string
    required: true
    unique: true
  - name: name
    owner_class: Assembly
    datatype: string
  - name: revision_id
    owner_class: Revision
    datatype: string
    required: true
    unique: true
  - name: eco_id
    owner_class: ECO
    datatype: string
    required: true
    unique: true
  - name: status
    owner_class: ECO
    datatype: string
  - name: name
    owner_class: Operation
    datatype: string
    required: true
  - name: name
    owner_class: WorkCenter
    datatype: string
    required: true
  - name: name
    owner_class: Substance
    datatype: string
  - name: cas_number
    owner_class: Substance
    datatype: string
    required: true
    unique: true
  - name: name
    owner_class: Customer
    datatype: string
    required: true
