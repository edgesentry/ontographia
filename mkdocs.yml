site_name: Ontographia
site_description: Multi-ontology deterministic Cypher 25 query generation for Neo4j.
site_url: https://edgesentry.github.io/ontographia/
repo_url: https://github.com/edgesentry/ontographia
repo_name: edgesentry/ontographia
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - admonition

nav:
  - Home: index.md
  - Getting started:
    - Rust: rust.md
    - Python: python.md
    - Go: go.md
  - Architecture: architecture.md
  - Related work: related-work.md
  - Neo4j walkthrough: end-to-end-neo4j.md
  - Ontology & graph alignment: ontology-graph-alignment.md
  - Repository layout: repository-layout.md
  - Release: release.md
  - LiteLLM (local): litellm-local.md
  - CodeQL setup: codeql-setup.md
