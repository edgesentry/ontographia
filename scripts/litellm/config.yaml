# LiteLLM proxy — OpenAI, Gemini, and Cursor-adjacent models for local Ontographia E2E.
#
# Public model aliases (use as OPENAI_MODEL when calling http://127.0.0.1:4000/v1):
#   ontographia-openai   → openai/gpt-4o-mini
#   ontographia-gemini-3.7 → gemini/gemini-3.7-flash (Part 3 / v0.1.6 baselines)
#   ontographia-gemini-3.8 → gemini/gemini-3.8-flash (issue #106)
#
# Gemini aliases are always versioned (no unversioned ontographia-gemini alias since #106),
# so 3.7 and 3.8 can be used side by side, like testing several Python versions.
#   ontographia-cursor   → anthropic/claude-sonnet-4-20250514 (typical Cursor stack via LiteLLM)
#
# Cursor IDE routes through LiteLLM at /cursor (see docs/litellm-local.md).
# Cursor Cloud Agents use CURSOR_API_KEY pass-through at /cursor/v0/*.

model_list:
  - model_name: ontographia-openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: ontographia-gemini-3.7
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: ontographia-gemini-3.8
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: ontographia-cursor
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # Distinct public name for Cursor IDE custom model picker (avoids built-in name collisions).
  - model_name: litellm-claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
