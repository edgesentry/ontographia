[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ontographia"
description = "Multi-ontology deterministic Cypher 25 query builder"
dynamic = ["version"]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ontographia Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
keywords = ["neo4j", "cypher", "ontology", "graph", "rdf"]

[project.urls]
Homepage = "https://github.com/edgesentry/ontographia"
Repository = "https://github.com/edgesentry/ontographia"
Documentation = "https://edgesentry.github.io/ontographia/"

[project.optional-dependencies]
llm = [
    "openai>=1.40",
    "pyyaml>=6.0",
]
mcp = [
    # FastMCP-style API: mcp 1.x (`FastMCP`) or mcp 2.x (`MCPServer` rename).
    "mcp>=1.9,<3",
    "neo4j>=5",
]
# Reserved for a future LiteLLM-backed LLMBackend (not implemented yet).
# litellm = ["litellm>=1.67"]

[project.scripts]
ontographia-mcp = "ontographia.mcp.__main__:main"

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "neo4j>=5",
    "mkdocs-material>=9.5,<10",
    "pytest>=8",
    "openai>=1.40",
    "pyyaml>=6.0",
    "mcp>=1.9,<3",
]
# Local LiteLLM proxy tooling for docs/litellm-local.md (not the package extra).
litellm = [
    "litellm[proxy]>=1.67",
]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "ontographia"
python-source = "python"
features = ["pyo3/extension-module"]
# Pure-Python ontographia.llm / ontographia.mcp ship via python-source.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
markers = [
    "neo4j: live Neo4j integration (skipped unless NEO4J_URI is set)",
]
